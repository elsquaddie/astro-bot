services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro_pass
      POSTGRES_DB: astro_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astro_bot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
